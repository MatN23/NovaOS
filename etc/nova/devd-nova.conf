# Nova Desktop devd configuration
# Install as /etc/devd/nova.conf

# ============================================================
# USB Storage Devices
# ============================================================

# USB storage device attached
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "ATTACH";
    match "class"       "0x08";
    action "/usr/libexec/nova/nova-devd-hook storage-attach $device-name";
};

# USB storage device detached
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "DETACH";
    match "class"       "0x08";
    action "/usr/libexec/nova/nova-devd-hook storage-detach $device-name";
};

# ============================================================
# Display / DRM Hotplug
# ============================================================

notify 100 {
    match "system"      "DRM";
    match "type"        "HOTPLUG";
    action "/usr/libexec/nova/nova-devd-hook display-change";
};

# ============================================================
# ACPI Events
# ============================================================

# Power button
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "Button";
    match "notify"      "0x00";
    action "/usr/libexec/nova/nova-devd-hook power-button";
};

# Sleep button
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "Button";
    match "notify"      "0x01";
    action "/usr/libexec/nova/nova-devd-hook sleep-button";
};

# Lid close
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "Lid";
    match "notify"      "0x00";
    action "/usr/libexec/nova/nova-devd-hook lid-close";
};

# Lid open
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "Lid";
    match "notify"      "0x01";
    action "/usr/libexec/nova/nova-devd-hook lid-open";
};

# AC adapter online
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "ACAD";
    match "notify"      "0x00";
    action "/usr/libexec/nova/nova-devd-hook ac-online";
};

# AC adapter offline
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "ACAD";
    match "notify"      "0x01";
    action "/usr/libexec/nova/nova-devd-hook ac-offline";
};

# Battery status change
notify 100 {
    match "system"      "ACPI";
    match "subsystem"   "CMBAT";
    action "/usr/libexec/nova/nova-devd-hook battery-change";
};

# ============================================================
# USB Audio Devices
# ============================================================

# USB audio device attached
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "ATTACH";
    match "class"       "0x01";
    action "/usr/libexec/nova/nova-devd-hook audio-attach $device-name";
};

# USB audio device detached
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "DETACH";
    match "class"       "0x01";
    action "/usr/libexec/nova/nova-devd-hook audio-detach $device-name";
};

# ============================================================
# Input Devices
# ============================================================

# USB HID device attached (keyboard, mouse, etc.)
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "ATTACH";
    match "class"       "0x03";
    action "/usr/libexec/nova/nova-devd-hook input-attach $device-name";
};

# USB HID device detached
notify 100 {
    match "system"      "USB";
    match "subsystem"   "DEVICE";
    match "type"        "DETACH";
    match "class"       "0x03";
    action "/usr/libexec/nova/nova-devd-hook input-detach $device-name";
};
